{% extends "base.html" %}{% block title %}Change password · XELO{% endblock %}{% block content %}<div class="container narrow"><span class="eyebrow">YOUR CAMPUS CONNECTION</span><h1 class="form-title">Change password</h1><div class="card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Current password<input name="current"
       type="password"
       autocomplete="current-password"
       required></label><label>New password<input name="password"
       type="password"
       minlength="12"
       maxlength="128"
       autocomplete="new-password"
       required></label><label>Confirm new password<input name="confirm" type="password" autocomplete="new-password" required></label><button class="primary">Update password</button></form></div></div>{% endblock %}
