{% extends "base.html" %}{% block content %}<div class="container narrow"><h1 class="form-title">Search history</h1><p>Saving history is optional. Manage it in <a href="/profile/edit">your profile</a>.</p><form method="post" action="/history/clear"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Delete my search history</button></form>{% for item in page.items %}<p><a href="{{ url_for('market.browse',q=item.term) }}">{{ item.term }}</a> · {{ item.created_at.strftime("%d %b") }}</p>{% else %}<p>No saved searches.</p>{% endfor %}{% include "pagination.html" %}</div>{% endblock %}
