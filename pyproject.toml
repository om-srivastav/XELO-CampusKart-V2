[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["migrations"]
[tool.ruff.lint]
select = ["E4","E7","E9","F","I"]
[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["F401"]
"app/__init__.py" = ["F401"]
"run.py" = ["E402"]
"wsgi.py" = ["E402"]
"tests/qa_server.py" = ["E402"]
