name: XELO verification
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: xelo_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: xelo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests run.py wsgi.py
      - name: Test SQLite
        if: matrix.database == 'sqlite'
        run: pytest --cov=app --cov-report=term-missing
      - name: Test PostgreSQL
        if: matrix.database == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://xelo_test:test-only-password@localhost:5432/xelo_test
        run: pytest
      - name: Upgrade PostgreSQL schema
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg://xelo_test:test-only-password@localhost:5432/xelo_test
        run: |
          flask --app wsgi db upgrade
          flask --app wsgi db check
      - run: pip-audit -r requirements.txt
