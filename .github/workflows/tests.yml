name: XELO FastAPI verification
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: xelo_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: xelo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests
      - name: Verify SQLite migrations
        if: matrix.database == 'sqlite'
        env:
          DATABASE_URL: sqlite:///instance/ci.db
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Verify PostgreSQL migrations
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg://xelo_test:test-only-password@localhost:5432/xelo_test
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Test SQLite
        if: matrix.database == 'sqlite'
        run: python -m pytest --cov=app --cov-report=term-missing
      - name: Test PostgreSQL
        if: matrix.database == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://xelo_test:test-only-password@localhost:5432/xelo_test
        run: python -m pytest
      - run: python -m pip_audit -r requirements.txt
