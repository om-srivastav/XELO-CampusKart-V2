{% extends "base.html" %}{% block content %}<div class="container narrow"><h1 class="form-title">Keep your campus safe.</h1><p>Report this {{ kind }}. Your report is visible only to moderators and you.</p><form method="post" class="card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Reason<select name="reason" required>{% for reason in reasons %}<option value="{{ reason }}">{{ reason|replace('_', ' ')|title }}</option>{% endfor %}</select></label><label>Tell us what happened<textarea name="description" maxlength="2000"></textarea></label><button class="primary">Submit report</button></form></div>{% endblock %}
