<form method="post"
      action="/admin/{{ 'category' if section=='categories' else 'campus' }}"
      class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="id" value="{{ row.id if row else '' }}"><label>Name<input name="name"
       value="{{ row.name if row else '' }}"
       maxlength="80"
       required></label>{% if section=="categories" %}<label>Description<input name="description"
       maxlength="300"
       value="{{ row.description if row else '' }}"></label><label>Icon<input name="icon" maxlength="10" value="{{ row.icon if row else '◇' }}"></label><label>Display order<input name="position"
       type="number"
       value="{{ row.position if row else 0 }}"></label>{% else %}<label>City<input name="city"
       maxlength="100"
       value="{{ row.city if row else '' }}"
       required></label><label class="full">Institutional email domains (comma separated; blank means manual approval)<input name="domains"
       maxlength="500"
       value="{{ row.domains if row else '' }}"></label>{% endif %}<label class="check"><input type="checkbox"
       name="active"
       {% if not row or row.active %}checked{% endif %}>Active</label><label>Private audit reason<input name="reason" minlength="3" maxlength="500" required></label><button>Save {{ 'category' if section=='categories' else 'campus' }}</button></form>
