# Deploy from the root of this xelo project. Paid services; review Render pricing before deployment.
services:
  - type: web
    name: xelo
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app wsgi db upgrade
    startCommand: gunicorn --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health/ready
    disk:
      name: xelo-uploads
      mountPath: /var/data/xelo
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: xelo-db
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: xelo-limits
          property: connectionString
      - key: UPLOAD_FOLDER
        value: /var/data/xelo/uploads
      - key: BASE_URL
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: MAIL_MODE
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_TLS
        value: "true"
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
  - type: keyvalue
    name: xelo-limits
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
databases:
  - name: xelo-db
    plan: basic-256mb
    databaseName: xelo
    ipAllowList: []
